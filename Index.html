<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Writing Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <div class="max-w-4xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-indigo-700 tracking-tight font-serif">StoryGhost</h1>
            <p class="mt-2 text-lg text-gray-600">Upload an image, and let the AI tell its story.</p>
        </header>

        <main class="bg-white shadow-xl rounded-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2">
            
            <!-- Left Side: Image Upload & Preview -->
            <div class="p-8 bg-gray-50 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-gray-200">
                
                <div id="upload-container" class="w-full h-64 border-2 border-dashed border-indigo-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-indigo-50 transition-colors relative group">
                    <input type="file" id="image-upload" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div id="upload-placeholder" class="text-center p-4">
                        <svg class="mx-auto h-12 w-12 text-indigo-400 group-hover:text-indigo-600 transition-colors" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <p class="mt-1 text-sm text-gray-600">Click or drag image here</p>
                    </div>
                    <img id="image-preview" src="" alt="Preview" class="absolute inset-0 w-full h-full object-cover rounded-xl hidden">
                </div>

                <button id="generate-btn" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg shadow transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled>
                    <span id="btn-text">Ghostwrite Story</span>
                    <svg id="loading-spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>

            </div>

            <!-- Right Side: Story Output -->
            <div class="p-8 flex flex-col h-full min-h-[400px]">
                <div class="flex-grow">
                    <h2 class="text-xl font-bold text-gray-800 mb-4 font-serif">Opening Paragraph</h2>
                    <div id="story-container" class="prose prose-indigo text-gray-600 font-serif leading-relaxed h-full">
                        <p id="placeholder-text" class="text-gray-400 italic">Upload an image and generate a story to see the opening paragraph here...</p>
                        <textarea id="story-text" class="w-full h-full p-2 border-0 focus:ring-0 resize-none outline-none hidden bg-transparent" readonly></textarea>
                    </div>
                </div>

                <div class="mt-6 flex items-center justify-between border-t pt-4">
                    <div class="flex items-center gap-2">
                         <span class="text-sm text-gray-500">Voice:</span>
                         <select id="voice-select" class="text-sm border-gray-300 rounded-md shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 max-w-[150px]">
                            <option value="">Default</option>
                         </select>
                    </div>
                    <button id="read-aloud-btn" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                        </svg>
                        Read Aloud
                    </button>
                    <button id="stop-read-btn" class="text-red-600 hover:text-red-800 font-medium flex items-center gap-2 hidden">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
                        </svg>
                        Stop
                    </button>
                </div>
            </div>

        </main>
        
        <footer class="text-center mt-12 text-sm text-gray-500">
            <p>Powered by AI (Mock) & Web Speech API</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
